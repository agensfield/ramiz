name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ramiz-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'agensfield/ramiz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      reuse_draft: ${{ steps.draft.outputs.reuse_draft }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tag, source version, and tagged commit
        id: source
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          test "$(git status --porcelain --untracked-files=all)" = ""
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          case "$version" in ''|*[!0-9A-Za-z.-]*) exit 1 ;; esac
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" --jq '[.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'" and .conclusion == "success")] | length')"
          test "$count" -ge 1
      - name: Detect existing exact draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "'"$GITHUB_REF_NAME"'") | [.id, .draft] | @tsv' | head -n 1)"
          if [ -z "$existing" ]; then
            printf 'reuse_draft=false\n' >> "$GITHUB_OUTPUT"
          else
            id="${existing%%$'\t'*}"
            draft="${existing#*$'\t'}"
            test "$draft" = true
            printf 'reuse_draft=true\n' >> "$GITHUB_OUTPUT"
            printf 'existing_release_id=%s\n' "$id" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.85.0 and target
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.85.0 rustfmt clippy
          test "$(rustc +1.85.0 --version | awk '{print $2}')" = 1.85.0
          rustup target add --toolchain 1.85.0 "${{ matrix.target }}"
      - name: Install musl linker
        if: startsWith(matrix.target, 'aarch64-unknown-linux-musl') || startsWith(matrix.target, 'x86_64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build unsigned target binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo +1.85.0 build --release --locked --target "${{ matrix.target }}"
      - name: Native target version, help, doctor, and creation smoke
        shell: bash
        run: |
          binary="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/ramiz"
          companion="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/git-ramiz"
          test "$("$binary" --version)" = "ramiz ${{ needs.source.outputs.version }}"
          test "$("$companion" --version)" = "ramiz ${{ needs.source.outputs.version }}"
          "$binary" --help >/dev/null
          doctor="$($binary doctor --json "$RUNNER_TEMP")"
          printf '%s\n' "$doctor" | jq -e '.data.path.display and (.data.path.bytes_base64 | length > 0)'
          repo="$RUNNER_TEMP/ramiz-native-smoke"
          mkdir -p "$repo"
          git -C "$repo" init -q -b main
          git -C "$repo" config user.name Ramiz
          git -C "$repo" config user.email ramiz@example.invalid
          printf 'native target smoke\n' > "$repo/file.txt"
          git -C "$repo" add file.txt
          git -C "$repo" commit -qm initial
          result="$(cd "$repo" && "$binary" add --json worktree)"
          printf '%s\n' "$result" | jq -e '.data.backend and .data.path.display'
          test -f "$repo/worktree/file.txt"
      - name: Package unsigned target archive
        shell: bash
        run: |
          mkdir -p dist
          ./scripts/package.sh archive --target "${{ matrix.target }}" --binary-dir "target/${{ matrix.target }}/release" --output dist --version "${{ needs.source.outputs.version }}" --commit "${{ needs.source.outputs.commit }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ramiz-release-${{ matrix.target }}-${{ needs.source.outputs.commit }}
          path: dist/ramiz_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ramiz-release-*
          path: dist/unsigned
          merge-multiple: true
      - name: Install Minisign before verification
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify unsigned package shape before signing
        run: |
          ./scripts/package.sh checksums --directory dist/unsigned
          tests/release_artifacts.sh dist/unsigned "$RELEASE_VERSION" "$RELEASE_COMMIT" --metadata-only
      - name: Prepare signing key after builds complete
        env:
          RAMIZ_MINISIGN_SECRET_KEY: ${{ secrets.RAMIZ_MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          test -n "$RAMIZ_MINISIGN_SECRET_KEY"
          key="$RUNNER_TEMP/ramiz-minisign.key"
          (umask 077 && printf '%s\n' "$RAMIZ_MINISIGN_SECRET_KEY" > "$key")
          printf 'RAMIZ_MINISIGN_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Sign each archive manifest in a constrained post-build job
        shell: bash
        run: |
          mkdir -p dist/signed
          for archive in dist/unsigned/ramiz_*.tar.gz; do
            case "$archive" in
              *_darwin_arm64.tar.gz) target=aarch64-apple-darwin ;;
              *_darwin_amd64.tar.gz) target=x86_64-apple-darwin ;;
              *_linux_arm64.tar.gz) target=aarch64-unknown-linux-musl ;;
              *_linux_amd64.tar.gz) target=x86_64-unknown-linux-musl ;;
              *) exit 1 ;;
            esac
            extract="$RUNNER_TEMP/ramiz-extract-$target"
            mkdir -p "$extract"
            tar -xzf "$archive" -C "$extract"
            ./scripts/package.sh archive --target "$target" --binary-dir "$extract" --output dist/signed --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --signing-key-file "$RAMIZ_MINISIGN_KEY"
          done
      - name: Remove signing key before executable acceptance
        shell: bash
        run: |
          rm -f "$RAMIZ_MINISIGN_KEY"
          test ! -e "$RAMIZ_MINISIGN_KEY"
          unset RAMIZ_MINISIGN_KEY
      - name: Verify signed archive metadata before publishing
        run: |
          ./scripts/package.sh checksums --directory dist/signed
          tests/release_artifacts.sh dist/signed "$RELEASE_VERSION" "$RELEASE_COMMIT" --require-signatures --metadata-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ramiz-signed-${{ needs.source.outputs.commit }}
          path: dist/signed/ramiz_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [source, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.source.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ramiz-signed-${{ needs.source.outputs.commit }}
          path: dist/release
      - name: Install Minisign before artifact verification
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify signed archives and create checksums
        run: |
          ./scripts/package.sh checksums --directory dist/release
          tests/release_artifacts.sh dist/release "$RELEASE_VERSION" "$RELEASE_COMMIT" --require-signatures --metadata-only
      - name: Sign checksum manifest
        env:
          RAMIZ_MINISIGN_SECRET_KEY: ${{ secrets.RAMIZ_MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          test -n "$RAMIZ_MINISIGN_SECRET_KEY"
          key="$RUNNER_TEMP/ramiz-minisign.key"
          (umask 077 && printf '%s\n' "$RAMIZ_MINISIGN_SECRET_KEY" > "$key")
          minisign -Sm dist/release/checksums.txt -s "$key" -x dist/release/checksums.txt.minisig -t "ramiz-checksums-v1"
          minisign -Vm dist/release/checksums.txt -p release/minisign.pub -x dist/release/checksums.txt.minisig
          rm -f "$key"
      - name: Attest final signed release subjects
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/ramiz_*.tar.gz
            dist/release/checksums.txt
            dist/release/checksums.txt.minisig
          create-storage-record: false
      - name: Verify final subject attestations
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          cp "$ATTESTATION_BUNDLE" dist/release/attestation.jsonl
          for artifact in dist/release/ramiz_*.tar.gz dist/release/checksums.txt dist/release/checksums.txt.minisig; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --bundle dist/release/attestation.jsonl --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --signer-digest "$RELEASE_COMMIT" --source-digest "$RELEASE_COMMIT" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
      - name: Create complete draft release
        if: needs.source.outputs.reuse_draft != 'true'
        run: gh release create "$GITHUB_REF_NAME" dist/release/ramiz_*.tar.gz dist/release/checksums.txt dist/release/checksums.txt.minisig dist/release/attestation.jsonl --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_COMMIT" --title "Ramiz $GITHUB_REF_NAME" --generate-notes --draft --prerelease="$RELEASE_PRERELEASE" --latest=false
      - name: Verify and reuse existing exact draft release
        if: needs.source.outputs.reuse_draft == 'true'
        shell: bash
        run: |
          mkdir -p dist/existing-draft
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist/existing-draft --pattern 'ramiz_*.tar.gz' --pattern checksums.txt --pattern checksums.txt.minisig --pattern attestation.jsonl
          tests/release_artifacts.sh dist/existing-draft "$RELEASE_VERSION" "$RELEASE_COMMIT" --require-signatures --metadata-only
          minisign -Vm dist/existing-draft/checksums.txt -p release/minisign.pub -x dist/existing-draft/checksums.txt.minisig
          for artifact in dist/release/ramiz_*.tar.gz; do cmp "$artifact" "dist/existing-draft/$(basename "$artifact")"; done
          cmp dist/release/checksums.txt dist/existing-draft/checksums.txt
          cmp dist/release/checksums.txt.minisig dist/existing-draft/checksums.txt.minisig
          for artifact in dist/existing-draft/ramiz_*.tar.gz dist/existing-draft/checksums.txt dist/existing-draft/checksums.txt.minisig; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --bundle dist/existing-draft/attestation.jsonl --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --signer-digest "$RELEASE_COMMIT" --source-digest "$RELEASE_COMMIT" --source-ref "$GITHUB_REF" --deny-self-hosted-runners; done
      - name: Verify downloaded draft assets before crate publication
        shell: bash
        run: |
          mkdir -p dist/downloaded
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist/downloaded --pattern 'ramiz_*.tar.gz' --pattern checksums.txt --pattern checksums.txt.minisig --pattern attestation.jsonl
          tests/release_artifacts.sh dist/downloaded "$RELEASE_VERSION" "$RELEASE_COMMIT" --require-signatures --metadata-only
          minisign -Vm dist/downloaded/checksums.txt -p release/minisign.pub -x dist/downloaded/checksums.txt.minisig
          for artifact in dist/release/ramiz_*.tar.gz; do cmp "$artifact" "dist/downloaded/$(basename "$artifact")"; done
          cmp dist/release/checksums.txt dist/downloaded/checksums.txt
          cmp dist/release/checksums.txt.minisig dist/downloaded/checksums.txt.minisig
          for artifact in dist/downloaded/ramiz_*.tar.gz dist/downloaded/checksums.txt dist/downloaded/checksums.txt.minisig; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --bundle dist/downloaded/attestation.jsonl --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --signer-digest "$RELEASE_COMMIT" --source-digest "$RELEASE_COMMIT" --source-ref "$GITHUB_REF" --deny-self-hosted-runners; done

  publish-crate:
    needs: [source, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Package exact crate and reconcile registry state
        id: registry
        shell: bash
        run: |
          cargo package --locked --no-verify
          crate="target/package/ramiz-${{ needs.source.outputs.version }}.crate"
          test -f "$crate"
          local_sha="$(sha256sum "$crate" | awk '{print $1}')"
          export RELEASE_VERSION="${{ needs.source.outputs.version }}" LOCAL_SHA="$local_sha"
          state="$(python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          url = f"https://crates.io/api/v1/crates/ramiz/{os.environ['RELEASE_VERSION']}"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  remote = json.load(response)["version"]["checksum"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("missing")
                  raise SystemExit
              raise
          if remote != os.environ["LOCAL_SHA"]:
              raise SystemExit("registry checksum does not match local crate")
          print("match")
          PY
          )"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io with trusted publishing when configured
        id: crates
        if: steps.registry.outputs.state == 'missing'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish exact tagged crate with token fallback
        if: steps.registry.outputs.state == 'missing'
        env:
          TRUSTED_TOKEN: ${{ steps.crates.outputs.token }}
          TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -n "$TRUSTED_TOKEN" ]; then CARGO_REGISTRY_TOKEN="$TRUSTED_TOKEN"; else test -n "$TOKEN_SECRET"; CARGO_REGISTRY_TOKEN="$TOKEN_SECRET"; fi
          export CARGO_REGISTRY_TOKEN
          cargo publish --locked

  binstall:
    needs: [source, draft, publish-crate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Download exact signed Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ramiz-signed-${{ needs.source.outputs.commit }}
          path: dist/signed
      - name: Install cargo-binstall
        run: cargo install cargo-binstall --version 1.23.0 --locked
      - name: Install both binaries through cargo-binstall from signed bytes
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/signed >/tmp/ramiz-binstall-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          cargo binstall --no-confirm --force --allow-insecure-http --targets x86_64-unknown-linux-musl --pkg-url "http://127.0.0.1:8765/ramiz_${RELEASE_VERSION}_linux_amd64.tar.gz" "ramiz@$RELEASE_VERSION"
          test "$(ramiz --version)" = "ramiz $RELEASE_VERSION"
          test "$(git-ramiz --version)" = "ramiz $RELEASE_VERSION"
          test "$(git ramiz --version)" = "ramiz $RELEASE_VERSION"

  cargo-update:
    needs: [source, publish-crate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Install exact MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Exercise real Cargo managed bootstrap update
        run: cargo +1.85.0 test --locked --test update_acceptance cargo_release_bootstrap_uses_real_install_and_records_both_bins -- --ignored --exact --nocapture

  publish:
    needs: [source, draft, publish-crate, binstall, cargo-update]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PRERELEASE: ${{ needs.source.outputs.prerelease }}
    steps:
      - name: Publish only after crate and cargo-binstall gates
        shell: bash
        run: |
          if [ "$RELEASE_PRERELEASE" = true ]; then latest=false; else latest=true; fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --prerelease="$RELEASE_PRERELEASE" --latest="$latest"

  recovery:
    needs: [source, draft, publish-crate, binstall, cargo-update, publish]
    if: ${{ always() && (needs.draft.result == 'failure' || needs.publish-crate.result == 'failure' || needs.binstall.result == 'failure' || needs.cargo-update.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Leave resumable recovery receipt
        shell: bash
        run: |
          echo "release $GITHUB_REF_NAME was not promoted"
          echo "an existing draft is reusable only after exact asset, checksum, Minisign, and attestation verification"
          echo "rerun this workflow after correcting the failed Cargo, crate, or cargo-binstall gate; the registry checksum gate prevents duplicate or mismatched crate publication"
